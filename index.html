<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="گفتگوی آنلاین با Firebase">
  <title>گفتگوی آنلاین</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="toast" class="toast" aria-live="polite"></div>

  <section id="authView" class="auth-shell">
    <div class="auth-card">
      <div class="brand">💬</div>
      <h1>گفتگوی آنلاین</h1>
      <p class="muted">با حساب خود وارد شوید یا یک حساب جدید بسازید.</p>

      <div class="tabs">
        <button id="loginTab" class="tab active">ورود</button>
        <button id="signupTab" class="tab">ثبت‌نام</button>
      </div>

      <form id="loginForm" class="form">
        <label>ایمیل</label>
        <input id="loginEmail" type="email" autocomplete="email" required placeholder="example@email.com">
        <label>رمز عبور</label>
        <input id="loginPassword" type="password" autocomplete="current-password" required placeholder="رمز عبور">
        <button class="primary-btn" type="submit">ورود به حساب</button>
        <button id="resetPasswordBtn" class="link-btn" type="button">فراموشی رمز عبور</button>
      </form>

      <form id="signupForm" class="form hidden">
        <label>نام</label>
        <input id="signupFirstName" type="text" maxlength="50" required placeholder="نام">
        <label>تخلص</label>
        <input id="signupLastName" type="text" maxlength="50" required placeholder="تخلص">
        <label>ایمیل</label>
        <input id="signupEmail" type="email" autocomplete="email" required placeholder="example@email.com">
        <label>رمز عبور</label>
        <input id="signupPassword" type="password" minlength="6" autocomplete="new-password" required placeholder="حداقل ۶ حرف">
        <label>تکرار رمز عبور</label>
        <input id="signupPassword2" type="password" minlength="6" autocomplete="new-password" required placeholder="تکرار رمز">
        <button class="primary-btn" type="submit">ساخت حساب</button>
      </form>
    </div>
  </section>

  <section id="appView" class="app-shell hidden">
    <header class="topbar">
      <div>
        <div class="brand-title">💬 گفتگوی آنلاین</div>
        <div id="myName" class="topbar-subtitle"></div>
      </div>
      <button id="logoutBtn" class="logout-btn">خروج</button>
    </header>

    <main class="workspace">
      <aside class="sidebar">
        <div class="sidebar-head">
          <h2>کاربران</h2>
          <span id="onlineCount" class="count-badge">۰ آنلاین</span>
        </div>
        <div id="usersList" class="users-list">
          <div class="empty-state">در حال بارگذاری کاربران...</div>
        </div>
      </aside>

      <section class="chat-panel">
        <div id="emptyChat" class="empty-chat">
          <div class="empty-icon">👋</div>
          <h2>یک کاربر را انتخاب کنید</h2>
          <p>بعد از انتخاب یک نفر، می‌توانید پیام بفرستید و پیام‌های او را هم لحظه‌ای دریافت کنید.</p>
        </div>

        <div id="chatView" class="chat-view hidden">
          <div class="chat-header">
            <div>
              <div id="chatUserName" class="chat-user-name"></div>
              <div id="chatUserStatus" class="chat-user-status"></div>
            </div>
          </div>

          <div id="messages" class="messages"></div>

          <form id="messageForm" class="message-form">
            <input id="messageInput" type="text" maxlength="2000" autocomplete="off" placeholder="پیام خود را بنویسید..." required>
            <button id="sendBtn" class="send-btn" type="submit">ارسال</button>
          </form>
        </div>
      </section>
    </main>
  </section>

  <script type="module" src="app.js"></script>
</body>
</html>
